name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Typecheck & Server Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 python3-gi gir1.2-secret-1 ripgrep bubblewrap dbus gnome-keyring libglib2.0-bin libsecret-1-0
          google-chrome --version

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run server tests
        run: |
          test_root=$(mktemp -d "$RUNNER_TEMP/agentic-tests.XXXXXX")
          trap 'rm -rf "$test_root"' EXIT
          export HOME="$test_root/home" XDG_CONFIG_HOME="$test_root/config" XDG_DATA_HOME="$test_root/data"
          export XDG_RUNTIME_DIR="$test_root/runtime" AD_DATA_DIR="$test_root/app" AD_KEYRING=memory
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR" "$test_root/bin"
          chmod 700 "$XDG_RUNTIME_DIR"
          ln -s /usr/bin/python3 "$test_root/bin/python3"
          export PATH="$test_root/bin:$PATH"
          python3 -I -c "import gi; gi.require_version('Secret', '1'); from gi.repository import Secret"
          browser_tests=(server/test/browser-thread-tabs.test.ts server/test/browser.test.ts server/test/code-panels-tools.test.ts)
          node --test --test-concurrency=1 "${browser_tests[@]}"
          remaining=()
          for test in server/test/*.test.ts; do
            case " ${browser_tests[*]} " in *" $test "*) continue;; esac
            remaining+=("$test")
          done
          node --test --test-concurrency=4 "${remaining[@]}"
