name: Bug report
description: Report a bug or unexpected behavior in Agentic Desktop
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please do **not** include API keys, tokens, or personal credentials in your report.
        To report a security vulnerability, follow the [security policy](https://github.com/bejulian1/agentic-desktop/blob/main/SECURITY.md#reporting-a-vulnerability) instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Found in Settings → About, or the git commit if running from source.
      placeholder: "e.g. 0.29.1"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: How are you running Agentic Desktop?
      options:
        - AppImage
        - .deb package
        - Installed from source (./install.sh)
        - Localhost dev server (npm start)
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Linux environment
      description: Distribution, desktop environment / Wayland or X11, and Node.js version (if running from source).
      placeholder: "e.g. Ubuntu 26.04, GNOME Wayland, Node 26.8"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste any relevant console/server output (redact any sensitive paths or tokens).
      render: shell
